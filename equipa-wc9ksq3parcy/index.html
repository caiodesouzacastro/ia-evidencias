<script>
const b64 = id => Uint8Array.from(atob(document.getElementById(id).value), c => c.charCodeAt(0));
async function abrir(senha) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64("sal"), iterations: 600000, hash: "SHA-256"},
                                          base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const claro = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64("iv")}, k, b64("dados"));
  try { sessionStorage.setItem("equipa", senha); } catch (e) {}
  document.open(); document.write(new TextDecoder().decode(claro)); document.close();
}
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const botao = document.getElementById("b"), msg = document.getElementById("msg");
  botao.disabled = true; msg.textContent = "";
  try { await abrir(document.getElementById("s").value.trim()); }
  catch (e) { msg.textContent = "Palavra-passe errada."; botao.disabled = false; }
});
try { const s = sessionStorage.getItem("equipa"); if (s) abrir(s).catch(() => {}); } catch (e) {}
</script>
